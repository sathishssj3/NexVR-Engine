version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexvr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexvr
      POSTGRES_PASSWORD: nexvr_password
      POSTGRES_DB: nexvr_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexvr -d nexvr_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexvr-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:latest
    container_name: nexvr-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - localstack_data:/var/lib/localstack

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexvr-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=development
      - PORT=4000
      - DATABASE_URL=postgresql://nexvr:nexvr_password@postgres:5432/nexvr_db?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=dev-jwt-super-secret-key
      - AWS_REGION=us-east-1
      - S3_BUCKET_NAME=nexvr-releases-bucket
      - S3_ENDPOINT=http://localstack:4566
    ports:
      - "4000:4000"

volumes:
  postgres_data:
  redis_data:
  localstack_data:
