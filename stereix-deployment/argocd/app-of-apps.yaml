apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nexvr-root-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sathishssj3/NexVR-Engine.git
    targetRevision: HEAD
    path: nexvr-deployment/argocd
    directory:
      recurse: false
      exclude: 'app-of-apps.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
