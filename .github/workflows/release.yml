# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI - Build, Test, and Analyze

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
    paths-ignore:
      - 'nexvr-docs/**'
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'nexvr-docs/**'
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: windows-latest
    permissions:
      contents: write
      # Needed for the GitHub CodeQL action
      security-events: write
      actions: write

    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Decode Release Signing Certificate
      if: matrix.configuration == 'Release' && startsWith(github.ref, 'refs/tags/')
      shell: pwsh
      env:
        CERT_BASE64: ${{ secrets.SIGN_CERT_PATH }}
        CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASS }}
      run: |
        $ErrorActionPreference = 'Stop'
        if ([string]::IsNullOrWhiteSpace($env:CERT_BASE64) -or [string]::IsNullOrWhiteSpace($env:CERT_PASSWORD)) {
          throw "Release signing certificate and password are required."
        }
        $certPath = Join-Path $env:RUNNER_TEMP 'nexvr-signing.pfx'
        try {
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:CERT_BASE64))
          $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new($certPath, $env:CERT_PASSWORD)
          $eku = $cert.Extensions | Where-Object { $_ -is [Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension] } | Select-Object -First 1
          if (-not $cert.HasPrivateKey -or (Get-Date) -lt $cert.NotBefore -or (Get-Date) -gt $cert.NotAfter -or
              -not $eku -or -not @($eku.EnhancedKeyUsages | Where-Object { $_.Value -eq '1.3.6.1.5.5.7.3.3' }).Count) {
            throw "Invalid code-signing certificate."
          }
        } catch {
          Remove-Item -LiteralPath $certPath -Force -ErrorAction SilentlyContinue
          throw "Release signing certificate is invalid or cannot be decoded."
        }
        "SIGN_CERT_PATH=$certPath" >> $env:GITHUB_ENV
        "SIGN_CERT_PASS=$env:CERT_PASSWORD" >> $env:GITHUB_ENV

    - name: Setup MSVC & CMake
      uses: ilammy/msvc-dev-cmd@v1.13.0

    - name: Download Official DXC (for SPIR-V support)
      shell: cmd
      run: |
        curl.exe -L https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.7.2308/dxc_2023_08_14.zip -o dxc.zip
        7z.exe x dxc.zip -odxc -y

    - name: Cache Vulkan SDK
      id: cache-vulkan
      uses: actions/cache@v4
      with:
        path: C:\VulkanSDK
        key: vulkan-sdk-1.4-windows

    - name: Setup Vulkan SDK
      if: steps.cache-vulkan.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $VulkanURL = "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe"
        Write-Host "Downloading Vulkan SDK..."
        Invoke-WebRequest -Uri $VulkanURL -OutFile VulkanSDK.exe
        Write-Host "Installing Vulkan SDK..."
        Start-Process -FilePath ".\VulkanSDK.exe" -ArgumentList "--root", "C:\VulkanSDK", "--accept-licenses", "--default-answer", "--confirm-command", "install" -Wait -NoNewWindow

    - name: Configure Vulkan Environment
      shell: pwsh
      run: |
        echo "VULKAN_SDK=C:\VulkanSDK" >> $env:GITHUB_ENV
        echo "C:\VulkanSDK\Bin" >> $env:GITHUB_PATH

    # Only run CodeQL on Release configuration to avoid slowing down Debug by 4x and uploading duplicate alerts
    - name: Run CodeQL Analysis (Init)
      if: matrix.configuration == 'Release'
      uses: github/codeql-action/init@v4
      with:
        languages: cpp

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Generate Dummy Models
      shell: pwsh
      run: |
        pip install onnx
        if (-not (Test-Path models)) { mkdir models }
        python generate_dummy_onnx.py
        Copy-Item models/dummy.onnx models/depth_inpainter.onnx
        Copy-Item models/dummy_ui.onnx models/ui_synthesizer.onnx

    - name: Configure CMake
      run: cmake -B build -S . -A x64 -DDXC_EXECUTABLE="${{ github.workspace }}/dxc/bin/x64/dxc.exe" -DBUILD_TESTS=ON

    - name: Build
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        cmake --build build --config ${{ matrix.configuration }} -- /maxcpucount
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Build failed!"
          exit 1
        }

    # Run Cppcheck once (on Release) so it doesn't run redundantly twice across matrix jobs
    - name: Run Cppcheck Static Analysis
      if: matrix.configuration == 'Release'
      shell: pwsh
      run: |
        $cppcheckVer = "2.14.0"
        $zipUrl = "https://github.com/danmar/cppcheck/releases/download/$cppcheckVer/cppcheck-$cppcheckVer-x64-Setup.msi"
        $installDir = "$env:RUNNER_TEMP\cppcheck"

        Write-Host "Installing cppcheck $cppcheckVer..."
        Invoke-WebRequest -Uri $zipUrl -OutFile "$env:RUNNER_TEMP\cppcheck.msi" -ErrorAction SilentlyContinue
        if (Test-Path "$env:RUNNER_TEMP\cppcheck.msi") {
          Start-Process msiexec.exe -ArgumentList "/i", "$env:RUNNER_TEMP\cppcheck.msi", "/qn", "INSTALLDIR=$installDir" -Wait -NoNewWindow
        }

        $cppcheckExe = "$installDir\cppcheck.exe"
        if (-not (Test-Path $cppcheckExe)) {
          Write-Host "MSI install failed, trying choco..."
          choco install cppcheck -y --no-progress | Out-Null
          $cppcheckExe = "cppcheck"
        }

        Write-Host "Running cppcheck..."
        & $cppcheckExe --enable=warning,performance `
          --suppress=missingIncludeSystem `
          --suppress=unmatchedSuppression `
          --suppress=missingInclude `
          --suppress=cstyleCast `
          --suppress=toomanyconfigs `
          --suppress=normalCheckLevelMaxBranches `
          --inline-suppr `
          -I nexvr-client/src -I src `
          $(if (Test-Path nexvr-client/src) { "nexvr-client/src/" } else { "src/" }) 2>&1
        $code = $LASTEXITCODE
        if ($code -ne 0) {
          Write-Host "::warning::Cppcheck exited with code $code (non-fatal, CodeQL is primary analyzer)"
        }
        exit 0

    - name: CodeQL Perform Analysis
      if: matrix.configuration == 'Release'
      uses: github/codeql-action/analyze@v4
      continue-on-error: true
      with:
        category: "/language:cpp"

    - name: Run Coupling Ratchets
      shell: pwsh
      run: |
        ./scripts/check_coupling.ps1

    - name: Run Tests
      shell: pwsh
      working-directory: build
      run: |
        $ErrorActionPreference = 'Continue'
        ctest -C ${{ matrix.configuration }} --output-on-failure --timeout 180 --output-junit TestResults.xml
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      continue-on-error: true
      with:
        name: test-results-${{ matrix.configuration }}
        path: |
          build/TestResults.xml
          **/TestResult*.xml
          **/test_results*.xml
          **/TEST-*.xml
        retention-days: 7

    - name: Setup Node.js for Full Suite Verification
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: |
          nexvr-client/launcher/package-lock.json
          nexvr-backend/package-lock.json

    - name: Run Launcher CI Checks
      working-directory: nexvr-client/launcher
      run: |
        npm install
        npm run test:ci

    - name: Run Backend Test Suite
      working-directory: nexvr-backend
      run: |
        npm install
        npm test

    # Export compiled engine binaries from Release configuration so testers and the release job can reuse them
    - name: Upload Release Engine Binaries
      if: matrix.configuration == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: test-ai-binaries
        path: |
          build/bin/vrinject.dll
          build/bin/vr-inject-cli.exe
          build/bin/onnxruntime.dll
          build/bin/DirectML.dll
          build/bin/proxy/dxgi.dll
          build/bin/proxy/d3d11.dll
          build/bin/shaders
        retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-and-test
    runs-on: windows-latest
    permissions:
      contents: write
      issues: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Download Pre-compiled Engine Binaries
      uses: actions/download-artifact@v4
      with:
        name: test-ai-binaries
        path: build/bin

    - name: Decode Release Signing Certificate
      shell: pwsh
      env:
        CERT_BASE64: ${{ secrets.SIGN_CERT_PATH }}
        CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASS }}
      run: |
        $ErrorActionPreference = 'Stop'
        if ([string]::IsNullOrWhiteSpace($env:CERT_BASE64) -or [string]::IsNullOrWhiteSpace($env:CERT_PASSWORD)) {
          throw "Release signing certificate and password are required."
        }
        $certPath = Join-Path $env:RUNNER_TEMP 'nexvr-signing.pfx'
        try {
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:CERT_BASE64))
          $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new($certPath, $env:CERT_PASSWORD)
          $eku = $cert.Extensions | Where-Object { $_ -is [Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension] } | Select-Object -First 1
          if (-not $cert.HasPrivateKey -or (Get-Date) -lt $cert.NotBefore -or (Get-Date) -gt $cert.NotAfter -or
              -not $eku -or -not @($eku.EnhancedKeyUsages | Where-Object { $_.Value -eq '1.3.6.1.5.5.7.3.3' }).Count) {
            throw "Invalid code-signing certificate."
          }
        } catch {
          Remove-Item -LiteralPath $certPath -Force -ErrorAction SilentlyContinue
          throw "Release signing certificate is invalid or cannot be decoded."
        }
        "SIGN_CERT_PATH=$certPath" >> $env:GITHUB_ENV
        "SIGN_CERT_PASS=$env:CERT_PASSWORD" >> $env:GITHUB_ENV

    - name: Verify Signed Engine Binaries
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new($env:SIGN_CERT_PATH, $env:SIGN_CERT_PASS)
        $dll = 'build/bin/vrinject.dll'
        $cli = 'build/bin/vr-inject-cli.exe'
        foreach ($file in @($dll, $cli)) {
          $signature = Get-AuthenticodeSignature -LiteralPath $file
          if ($signature.Status -ne 'Valid' -or -not $signature.SignerCertificate -or
              $signature.SignerCertificate.Thumbprint -ne $cert.Thumbprint) {
            throw "Invalid or unexpected Authenticode signature: $file"
          }
        }
        # CMake signs the DLL, hashes it into expected_hash.h, then builds the CLI.
        $dllHash = (Get-FileHash -LiteralPath $dll -Algorithm SHA256).Hash
        $cliImage = [IO.File]::ReadAllBytes((Resolve-Path -LiteralPath $cli).Path)
        if (-not [Text.Encoding]::Unicode.GetString($cliImage).Contains($dllHash)) {
          throw "The signed DLL's SHA-256 does not match the CLI's embedded verification hash."
        }

    - name: Verify Production Model Weights
      shell: pwsh
      env:
        RELEASE_MODELS_SHA256: ${{ secrets.RELEASE_MODELS_SHA256 }}
      run: |
        $ErrorActionPreference = 'Stop'
        if ([string]::IsNullOrWhiteSpace($env:RELEASE_MODELS_SHA256)) {
          throw "Approved production model hashes are required for a public release."
        }
        try {
          $expected = ConvertFrom-Json -InputObject $env:RELEASE_MODELS_SHA256 -AsHashtable -ErrorAction Stop
        } catch {
          throw "Release model hashes must be a JSON object of relative filenames to SHA-256 digests."
        }
        if ($expected -isnot [System.Collections.IDictionary] -or $expected.Count -eq 0) {
          throw "Release model hash manifest is empty or invalid."
        }
        foreach ($name in @('depth_inpainter.onnx', 'ui_synthesizer.onnx')) {
          if (-not $expected.ContainsKey($name)) { throw "Missing approved model hash: $name" }
        }
        $modelDir = (Resolve-Path -LiteralPath 'nexvr-client/models').Path
        $files = @(Get-ChildItem -LiteralPath $modelDir -File -Recurse | Where-Object { $_.Name -match '\.onnx(\.data)?$' })
        if ($files.Count -ne $expected.Count) { throw "Every packaged ONNX model must have an approved hash." }
        foreach ($file in $files) {
          $name = [IO.Path]::GetRelativePath($modelDir, $file.FullName).Replace('\', '/')
          if ($name -match '(^|/)dummy(_ui)?\.onnx$' -or -not $expected.ContainsKey($name) -or
              $expected[$name] -notmatch '^[A-Fa-f0-9]{64}$' -or
              (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash -ne $expected[$name]) {
            throw "Unapproved or missing production model weight: $name"
          }
          if ([Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($file.FullName)) -match
              'dummy_generator|dummy_model|dummy_graph|dummy_add|version https://git-lfs.github.com/spec/v1') {
            throw "Dummy model or Git LFS pointer cannot be released: $name"
          }
        }

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 'nexvr-client/launcher/package-lock.json'

    - name: Install Launcher Dependencies
      working-directory: ./nexvr-client/launcher
      run: npm install

    - name: Link Build Output for Launcher Packaging
      shell: pwsh
      run: |
        if (-not (Test-Path nexvr-client/build)) {
          cmd /c mklink /J "nexvr-client\build" "build"
        }

    - name: Build and Package Electron App
      working-directory: ./nexvr-client/launcher
      # This triggers vite build, tsc, and electron-builder
      run: npm run pack

    - name: Verify Packaged Launcher Signatures
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new($env:SIGN_CERT_PATH, $env:SIGN_CERT_PASS)
        foreach ($pattern in @('NexVR-Engine-Setup-*.exe', 'NexVR-Engine-Portable-*.exe')) {
          $files = @(Get-ChildItem -LiteralPath 'nexvr-client/launcher/dist-electron' -Filter $pattern -File)
          if ($files.Count -eq 0) { throw "Missing packaged launcher: $pattern" }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne 'Valid' -or -not $signature.SignerCertificate -or
                $signature.SignerCertificate.Thumbprint -ne $cert.Thumbprint) {
              throw "Invalid or unexpected launcher signature: $($file.Name)"
            }
          }
        }

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nexvr-engine-installer
        path: |
          nexvr-client/launcher/dist-electron/NexVR-Engine-Setup-*.exe
          nexvr-client/launcher/dist-electron/NexVR-Engine-Portable-*.exe

    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          nexvr-client/launcher/dist-electron/NexVR-Engine-Setup-*.exe
          nexvr-client/launcher/dist-electron/NexVR-Engine-Portable-*.exe