# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI - Build, Test, and Analyze

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    permissions:
      contents: write
      # Needed for the GitHub CodeQL action
      security-events: write
      actions: read

    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup MSVC & CMake
      uses: ilammy/msvc-dev-cmd@v1.13.0

    - name: Download Official DXC (for SPIR-V support)
      shell: cmd
      run: |
        curl.exe -L https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.7.2308/dxc_2023_08_14.zip -o dxc.zip
        7z.exe x dxc.zip -odxc -y

    - name: Cache Vulkan SDK
      id: cache-vulkan
      uses: actions/cache@v4
      with:
        path: C:\VulkanSDK
        key: vulkan-sdk-1.4-windows

    - name: Setup Vulkan SDK
      if: steps.cache-vulkan.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $VulkanURL = "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe"
        Write-Host "Downloading Vulkan SDK..."
        Invoke-WebRequest -Uri $VulkanURL -OutFile VulkanSDK.exe
        Write-Host "Installing Vulkan SDK..."
        Start-Process -FilePath ".\VulkanSDK.exe" -ArgumentList "--root", "C:\VulkanSDK", "--accept-licenses", "--default-answer", "--confirm-command", "install" -Wait -NoNewWindow

    - name: Configure Vulkan Environment
      shell: pwsh
      run: |
        echo "VULKAN_SDK=C:\VulkanSDK" >> $env:GITHUB_ENV
        echo "C:\VulkanSDK\Bin" >> $env:GITHUB_PATH

    # Only run CodeQL on Release configuration to avoid slowing down Debug by 4x and uploading duplicate alerts
    - name: Run CodeQL Analysis (Init)
      if: matrix.configuration == 'Release'
      uses: github/codeql-action/init@v4
      with:
        languages: cpp

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Generate Dummy Models
      shell: pwsh
      run: |
        pip install onnx
        if (-not (Test-Path models)) { mkdir models }
        python generate_dummy_onnx.py
        Copy-Item models/dummy.onnx models/depth_inpainter.onnx
        Copy-Item models/dummy_ui.onnx models/ui_synthesizer.onnx

    - name: Configure CMake
      run: cmake -B build -S . -A x64 -DDXC_EXECUTABLE="${{ github.workspace }}/dxc/bin/x64/dxc.exe" -DBUILD_TESTS=ON

    - name: Build
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        cmake --build build --config ${{ matrix.configuration }} -- /maxcpucount
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Build failed!"
          exit 1
        }

    # Run Cppcheck once (on Release) so it doesn't run redundantly twice across matrix jobs
    - name: Run Cppcheck Static Analysis
      if: matrix.configuration == 'Release'
      shell: pwsh
      run: |
        $cppcheckVer = "2.14.0"
        $zipUrl = "https://github.com/danmar/cppcheck/releases/download/$cppcheckVer/cppcheck-$cppcheckVer-x64-Setup.msi"
        $installDir = "$env:RUNNER_TEMP\cppcheck"

        Write-Host "Installing cppcheck $cppcheckVer..."
        Invoke-WebRequest -Uri $zipUrl -OutFile "$env:RUNNER_TEMP\cppcheck.msi" -ErrorAction SilentlyContinue
        if (Test-Path "$env:RUNNER_TEMP\cppcheck.msi") {
          Start-Process msiexec.exe -ArgumentList "/i", "$env:RUNNER_TEMP\cppcheck.msi", "/qn", "INSTALLDIR=$installDir" -Wait -NoNewWindow
        }

        $cppcheckExe = "$installDir\cppcheck.exe"
        if (-not (Test-Path $cppcheckExe)) {
          Write-Host "MSI install failed, trying choco..."
          choco install cppcheck -y --no-progress | Out-Null
          $cppcheckExe = "cppcheck"
        }

        Write-Host "Running cppcheck..."
        & $cppcheckExe --enable=warning,performance `
          --suppress=missingIncludeSystem `
          --suppress=unmatchedSuppression `
          --suppress=missingInclude `
          --suppress=cstyleCast `
          --suppress=toomanyconfigs `
          --suppress=normalCheckLevelMaxBranches `
          --inline-suppr `
          -I nexvr-client/src -I src `
          $(if (Test-Path nexvr-client/src) { "nexvr-client/src/" } else { "src/" }) 2>&1
        $code = $LASTEXITCODE
        if ($code -ne 0) {
          Write-Host "::warning::Cppcheck exited with code $code (non-fatal, CodeQL is primary analyzer)"
        }
        exit 0

    - name: CodeQL Perform Analysis
      if: matrix.configuration == 'Release'
      uses: github/codeql-action/analyze@v4
      continue-on-error: true
      with:
        category: "/language:cpp"

    - name: Run Coupling Ratchets
      shell: pwsh
      run: |
        ./scripts/check_coupling.ps1

    - name: Run Tests
      shell: pwsh
      working-directory: build
      run: |
        $ErrorActionPreference = 'Continue'
        ctest -C ${{ matrix.configuration }} --output-on-failure --timeout 120 --output-junit TestResults.xml
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.configuration }}
        path: |
          build/TestResults.xml
          **/TestResult*.xml
          **/test_results*.xml
          **/TEST-*.xml
        retention-days: 7

    # Export compiled engine binaries from Release configuration so testers and the release job can reuse them
    - name: Upload Release Engine Binaries
      if: matrix.configuration == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: test-ai-binaries
        path: |
          build/bin/vrinject.dll
          build/bin/vr-inject-cli.exe
          build/bin/onnxruntime.dll
          build/bin/DirectML.dll
          build/bin/proxy/dxgi.dll
          build/bin/proxy/d3d11.dll
          build/bin/shaders
        retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-and-test
    runs-on: windows-latest
    permissions:
      contents: write
      issues: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download Pre-compiled Engine Binaries
      uses: actions/download-artifact@v4
      with:
        name: test-ai-binaries
        path: build/bin

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Generate Dummy Models
      shell: pwsh
      run: |
        pip install onnx
        if (-not (Test-Path models)) { mkdir models }
        python generate_dummy_onnx.py
        Copy-Item models/dummy.onnx models/depth_inpainter.onnx
        Copy-Item models/dummy_ui.onnx models/ui_synthesizer.onnx

    - name: Decode Code Signing Certificate
      shell: pwsh
      env:
        CERT_BASE64: ${{ secrets.SIGN_CERT_PATH }}
      run: |
        if ([string]::IsNullOrWhiteSpace($env:CERT_BASE64)) {
          Write-Host "No certificate secret found. Skipping decoding."
          exit 0
        }

        # Remove absolutely everything that is not a valid Base64 character
        $cleanBase64 = $env:CERT_BASE64 -replace '[^A-Za-z0-9+/=]', ''

        # Ensure the string length is a multiple of 4 (add missing padding)
        $pad = $cleanBase64.Length % 4
        if ($pad -gt 0) {
          Write-Host "Warning: Missing padding detected. Attempting to auto-fix..."
          $cleanBase64 += "=" * (4 - $pad)
        }

        try {
          $bytes = [Convert]::FromBase64String($cleanBase64)
          [IO.File]::WriteAllBytes("${{ github.workspace }}\cert.pfx", $bytes)
          echo "SIGN_CERT_PATH=${{ github.workspace }}\cert.pfx" >> $env:GITHUB_ENV
          echo "SIGN_CERT_PASS=${{ secrets.SIGN_CERT_PASS }}" >> $env:GITHUB_ENV
          Write-Host "Successfully decoded certificate."
        } catch {
          Write-Host "ERROR: The Base64 string is still completely invalid. You must re-copy it perfectly."
          exit 1
        }

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 'nexvr-client/launcher/package-lock.json'

    - name: Install Launcher Dependencies
      working-directory: ./nexvr-client/launcher
      run: npm install

    - name: Build and Package Electron App
      working-directory: ./nexvr-client/launcher
      # This triggers vite build, tsc, and electron-builder
      run: npm run pack

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nexvr-engine-installer
        path: |
          nexvr-client/launcher/dist-electron/NexVR Engine Setup*.exe
          nexvr-client/launcher/dist-electron/NexVR Engine Portable*.exe
          nexvr-client/launcher/dist-electron/*.zip

    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          nexvr-client/launcher/dist-electron/NexVR Engine Setup*.exe
          nexvr-client/launcher/dist-electron/NexVR Engine Portable*.exe
          nexvr-client/launcher/dist-electron/*.zip