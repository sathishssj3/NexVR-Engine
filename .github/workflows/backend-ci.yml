name: Backend CI & Docker Build

on:
  push:
    branches: [ "main" ]
    paths:
      - 'stereix-backend/**'
      - 'stereix-deployment/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'stereix-backend/**'
      - 'stereix-deployment/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test-and-lint:
    name: Test and Build TypeScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        working-directory: ./stereix-backend
        run: npm install

      - name: Prisma Generate
        working-directory: ./stereix-backend
        run: npx prisma generate

      - name: Compile TypeScript
        working-directory: ./stereix-backend
        run: npm run build

  docker-build:
    name: Build and Scan Docker Image
    needs: test-and-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./stereix-backend
          file: ./stereix-backend/Dockerfile
          push: false
          tags: stereix-backend:test
          load: true
