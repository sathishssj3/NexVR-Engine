name: Stereix B2B SDK CI & Zero-Crash Gate

on:
  push:
    branches: [ "main" ]
    paths:
      - 'include/**'
      - 'stereix-client/src/sdk/**'
      - 'stereix-client/src/adapters/**'
      - 'stereix-client/tests/test_sdk*'
      - 'stereix-client/tests/test_unreal*'
      - 'stereix-client/tests/test_unity*'
      - 'stereix-client/cmake/CompilerFlags.cmake'
      - 'stereix-client/cmake/Testing.cmake'
      - 'samples/cpp/**'
      - 'LICENSE_COMMERCIAL_B2B.md'
      - 'docs/B2B_SDK_INTEGRATION_GUIDE.md'
      - '.github/workflows/sdk-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'include/**'
      - 'stereix-client/src/sdk/**'
      - 'stereix-client/src/adapters/**'
      - 'stereix-client/tests/test_sdk*'
      - 'stereix-client/tests/test_unreal*'
      - 'stereix-client/tests/test_unity*'
      - 'stereix-client/cmake/CompilerFlags.cmake'
      - 'stereix-client/cmake/Testing.cmake'
      - 'samples/cpp/**'
      - 'LICENSE_COMMERCIAL_B2B.md'
      - 'docs/B2B_SDK_INTEGRATION_GUIDE.md'
      - '.github/workflows/sdk-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-b2b-sdk:
    name: Build & Verify B2B Enterprise SDK (Win64)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSVC & CMake
        uses: ilammy/msvc-dev-cmd@v1.13.0

      - name: Download Official DXC (for SPIR-V support)
        shell: cmd
        run: |
          curl.exe -L https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.7.2308/dxc_2023_08_14.zip -o dxc.zip
          7z.exe x dxc.zip -odxc -y

      - name: Cache Vulkan SDK
        id: cache-vulkan
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK
          key: vulkan-sdk-1.4-windows

      - name: Setup Vulkan SDK
        if: steps.cache-vulkan.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $VulkanURL = "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe"
          Write-Host "Downloading Vulkan SDK..."
          Invoke-WebRequest -Uri $VulkanURL -OutFile VulkanSDK.exe
          Write-Host "Installing Vulkan SDK..."
          Start-Process -FilePath ".\VulkanSDK.exe" -ArgumentList "--root", "C:\VulkanSDK", "--accept-licenses", "--default-answer", "--confirm-command", "install" -Wait -NoNewWindow

      - name: Configure Vulkan Environment
        shell: pwsh
        run: |
          echo "VULKAN_SDK=C:\VulkanSDK" >> $env:GITHUB_ENV
          echo "C:\VulkanSDK\Bin" >> $env:GITHUB_PATH

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -S . -A x64 -DDXC_EXECUTABLE="${{ github.workspace }}/dxc/bin/x64/dxc.exe" -DBUILD_TESTS=ON

      - name: Build SDK Libraries, Enterprise Test Harnesses & Minimal Sample
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build build --config Release --target nexvr_sdk nexvr_unity nexvr_unreal test_sdk_validation test_sdk_imports test_sdk_dx12 test_sdk_input test_unreal_bridge test_unity_bridge stereix_sample_d3d11 -- /maxcpucount

      - name: Run SDK Zero-Crash & Anti-Cheat Security Test Suite
        shell: pwsh
        working-directory: build
        run: |
          $ErrorActionPreference = 'Stop'
          ctest -C Release -R "test_sdk|test_unreal|test_unity" --output-on-failure --output-junit SdkTestResults.xml

      - name: Verify Minimal C++ Sample Execution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & "build\bin\stereix_sample_d3d11.exe" --frames 5

      - name: Stage B2B SDK Distribution Bundle
        shell: pwsh
        run: |
          $dist = "stereix-sdk-dist"
          New-Item -ItemType Directory -Path "$dist\bin", "$dist\include", "$dist\samples\cpp", "$dist\adapters\unreal", "$dist\adapters\unity", "$dist\legal", "$dist\docs" -Force | Out-Null
          
          # Binaries & Import Libraries
          Copy-Item "build\bin\stereix_sdk.dll" "$dist\bin\"
          Copy-Item "build\bin\stereix_sdk.lib" "$dist\bin\"
          Copy-Item "build\bin\stereix_unity.dll" "$dist\bin\"
          Copy-Item "build\bin\stereix_unity.lib" "$dist\bin\"
          Copy-Item "build\bin\stereix_unreal.dll" "$dist\bin\"
          Copy-Item "build\bin\stereix_unreal.lib" "$dist\bin\"
          Copy-Item "build\bin\stereix_sample_d3d11.exe" "$dist\bin\"

          # Public Headers
          Copy-Item "include\stereix_sdk.h" "$dist\include\"
          Copy-Item "include\nexvr_sdk.h" "$dist\include\"

          # Native C++ Sample
          Copy-Item "samples\cpp\*" "$dist\samples\cpp\" -Recurse

          # Engine Adapters
          Copy-Item "stereix-client\src\adapters\unreal\*" "$dist\adapters\unreal\" -Recurse
          Copy-Item "stereix-client\src\adapters\unity\*" "$dist\adapters\unity\" -Recurse

          # Legal & Commercial Docs
          Copy-Item "LICENSE_COMMERCIAL_B2B.md" "$dist\legal\"
          Copy-Item "docs\B2B_SDK_INTEGRATION_GUIDE.md" "$dist\docs\"

          Write-Host "SDK Distribution staged successfully:"
          Get-ChildItem -Path $dist -Recurse | Select-Object FullName

      - name: Upload SDK Artifact Bundle
        uses: actions/upload-artifact@v4
        with:
          name: stereix-b2b-sdk-windows-x64
          path: stereix-sdk-dist/
          retention-days: 14
